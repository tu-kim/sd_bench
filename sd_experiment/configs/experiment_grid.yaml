# SD trade-off experiment grid.
#
# A value of T (tree size) for a given (D, K) must satisfy
# T == sum(K**d for d in 1..D); configs that violate this are skipped by
# scripts/run_grid.sh.  For chain SD (K=1), T == D.

global:
  model: meta-llama/Llama-3.1-8B-Instruct
  draft_model: yuhuili/EAGLE3-LLaMA3.1-Instruct-8B
  method: eagle3
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.85
  max_model_len: 65536
  temperature: 0.0
  seed: 0
  warmup_decode_steps: 3        # discard first N decode steps per run
  max_steps: 200                # cap decode steps per run
  max_tokens: 128               # per-request
  num_samples_per_run: 16

phase1_batch_x_tree:
  # Fixed ~8K-token prompts.
  context_bucket: 8192
  batch_sizes:  [1, 4, 8, 16, 32]
  depths:       [1, 3, 5, 7]     # D = num_speculative_tokens
  tree_sizes:   [4, 8, 16, 32]   # T = num_draft_tokens
  # Branching K is derived from (D, T).  If no integer K>=1 solves
  # sum(K**d for d in 1..D) == T, the config is skipped.

phase2_context_sensitivity:
  batch_size: 8
  depth: 5
  context_buckets: [2048, 8192, 32768]
  tree_sizes: [4, 8, 16, 32]

phase3_baseline_no_sd:
  # SD disabled; sweep batch sizes for head-to-head comparison.
  context_bucket: 8192
  batch_sizes: [1, 4, 8, 16, 32]
